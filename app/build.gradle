plugins {
    id 'com.android.application'
}

android {
    namespace 'com.marketpro.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.marketpro.app'
        minSdk 26
        targetSdk 34
        versionCode 10
        versionName '1.8'
    }

    buildFeatures {
        buildConfig true
    }

    // مفتاح توقيع ثابت: كل التحديثات تُثبَّت فوق النسخة السابقة دون حذفها
    signingConfigs {
        fixed {
            storeFile rootProject.file('keystore/marketpro.jks')
            storePassword 'mpandroid2026'
            keyAlias 'marketpro'
            keyPassword 'mpandroid2026'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.4.1'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
}
